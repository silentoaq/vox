name = "vox-site"
main = "worker.js"
compatibility_date = "2026-11-01"
routes = [
  { pattern = "vox.lichitdev.com/", zone_name = "lichitdev.com" },
  { pattern = "vox.lichitdev.com/assets/*", zone_name = "lichitdev.com" },
  { pattern = "vox.lichitdev.com/latest/VoxSetup.exe", zone_name = "lichitdev.com" },
]

[assets]
directory = "./public"
binding = "ASSETS"

[[r2_buckets]]
binding = "RELEASES"
bucket_name = "vox-releases"
